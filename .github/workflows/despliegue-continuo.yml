name: CD # despliegue a Cloud Run (staging), solo despues de que CI pase en develop

# Se dispara cuando el workflow "CI" de este repo termina en develop, no directamente
# por push -- asi el despliegue nunca corre sobre un commit cuyas pruebas fallaron
# (disparado directo por push, el job de pruebas y el de despliegue correrian en
# paralelo sobre el mismo evento, sin que uno esperara al otro).
#
# github.sha no sirve dentro de un workflow disparado por workflow_run: apunta a la
# punta de la rama en el momento del evento, no al commit que realmente paso las
# pruebas -- por eso todo el workflow usa github.event.workflow_run.head_sha en su
# lugar.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

concurrency:
  group: cd-cuentas-${{ github.ref }}
  cancel-in-progress: false # nunca cancelar un deploy a medias

permissions:
  contents: read
  id-token: write

env:
  REGION: us-east1
  SERVICE: cameia-cuentas
  AR_REPO: cameia
  # Cloud SQL solo es alcanzable por IP privada dentro de esta VPC.
  VPC_NETWORK: cameia-staging
  VPC_SUBNET: cameia-staging-us-east1

jobs:
  desplegar-staging:
    name: Build, publicar imagen y desplegar a Cloud Run (staging)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Autenticar en GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker contra Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Tag corto (7 caracteres) calculado a partir del commit que disparo el evento
      # workflow_run, no de GITHUB_SHA -- este ultimo no corresponde a ese commit dentro
      # de un workflow disparado de esa forma.
      - name: Calcular tag de imagen
        id: imagen
        run: |
          SHA_CORTO=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          IMAGEN="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${SHA_CORTO}"
          echo "imagen=${IMAGEN}" >> "$GITHUB_OUTPUT"

      - name: Build de la imagen
        run: docker build -t "${{ steps.imagen.outputs.imagen }}" .

      - name: Publicar imagen en Artifact Registry
        run: docker push "${{ steps.imagen.outputs.imagen }}"

      # --port=8081: la aplicacion escucha en el puerto fijado por SERVER_PORT (default
      # 8081) y no lee la variable PORT que Cloud Run inyecta por su cuenta -- sin este
      # flag, Cloud Run seguiria intentando healthchecks contra su puerto por defecto y
      # el despliegue fallaria aunque el contenedor arranque bien.
      #
      # --ingress=internal: este servicio no atiende usuarios directamente, solo otro
      # componente interno de la plataforma -- exponerlo a internet directamente
      # ampliaria la superficie de ataque sin ningun beneficio funcional.
      #
      # DB_HOST/DB_NAME/DB_USERNAME apuntan a una base y un rol ya provisionados en la
      # instancia compartida; DB_PASSWORD viene de un secreto gestionado, nunca en texto
      # plano en este archivo.
      #
      # SPRING_PROFILES_ACTIVE=prod: sin esta variable, spring.profiles.default=local
      # (application.properties) queda activo por defecto y application-prod.properties
      # nunca se carga -- ese perfil fija spring.jpa.hibernate.ddl-auto=validate de forma
      # explicita (hoy cae en el default neutro de Spring para una base real, que no
      # valida nada) y bloquea springdoc de forma rigida. Hallazgo verificado el
      # 18-sep-2026 al revisar el mismo problema en cameia-gateway.
      #
      # FIREBASE_PROJECT_ID: identificador del proyecto de Firebase que custodia las
      # credenciales de los usuarios. Es obligatorio: FirebaseConfiguration crea el SDK
      # al arrancar y, sin este valor, el contenedor nunca llega a escuchar en el puerto
      # y Cloud Run marca la revision como fallida (el trafico sigue en la anterior).
      # Firebase y Cloud Run comparten proyecto de GCP, por eso se toma de GCP_PROJECT_ID.
      # Las pruebas de CI no lo detectan: corren con FIREBASE_ENABLED=false.
      #
      # --service-account: identidad de ejecucion dedicada y exclusiva de este servicio, no
      # la cuenta de Compute Engine que comparten otros servicios. Solo tiene lo que este
      # servicio necesita: administrar usuarios en Firebase Auth (roles/firebaseauth.admin)
      # y leer el secreto de su propia base. Asi ningun otro servicio hereda esos permisos.
      # La cuenta y sus permisos se gestionan fuera de este repositorio; la identidad que
      # ejecuta este despliegue necesita roles/iam.serviceAccountUser sobre ella.
      #
      # Sin --allow-unauthenticated: la identidad que ejecuta este despliegue no tiene
      # permiso para cambiar quien puede invocar el servicio, y no se le da ese permiso
      # solo para esto -- mantiene acotado el radio de lo que esa identidad puede hacer
      # si se ve comprometida.
      - name: Desplegar a Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image="${{ steps.imagen.outputs.imagen }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --port=8081 \
            --ingress=internal \
            --min-instances=0 \
            --max-instances=2 \
            --service-account="cameia-cuentas-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --network="${{ env.VPC_NETWORK }}" \
            --subnet="${{ env.VPC_SUBNET }}" \
            --vpc-egress=all-traffic \
            --set-env-vars="SPRING_PROFILES_ACTIVE=prod,DB_HOST=10.20.0.3,DB_PORT=5432,DB_NAME=cameia_cuentas,DB_USERNAME=cameia_cuentas,FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}" \
            --set-secrets="DB_PASSWORD=cloudsql-staging-cuentas-password:latest"

      - name: URL del servicio desplegado
        run: gcloud run services describe "${{ env.SERVICE }}" --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ env.REGION }}" --format="value(status.url)"

      # Smoke test (Anexo_Restricciones_Atributos_Calidad.pdf DPL-02: la promocion de un
      # digest exige "SHA, digest, aprobacion, smoke test y rollback"). Este servicio usa
      # --ingress=internal, sin ruta publica alcanzable desde este runner (a diferencia de
      # cameia-gateway, que si tiene Load Balancer publico) -- por eso el smoke test usa
      # la API de administracion de Cloud Run (autenticada con la misma identidad del
      # despliegue) para confirmar que la revision nueva quedo lista y sirve el 100% del
      # trafico, en vez de un curl a un endpoint real.
      - name: Smoke test — confirmar que la revisión nueva está lista y sirviendo tráfico
        run: |
          gcloud run services describe "${{ env.SERVICE }}" --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ env.REGION }}" --format=json > /tmp/servicio.json
          cat > /tmp/smoke.py <<'PYEOF'
          import json, sys
          data = json.load(open("/tmp/servicio.json"))
          conditions = data.get("status", {}).get("conditions", [])
          ready = next((c["status"] for c in conditions if c.get("type") == "Ready"), None)
          traffic = data.get("status", {}).get("traffic", [])
          full = [t.get("revisionName") for t in traffic if t.get("percent") == 100]
          print(f"Ready={ready}, revision con 100% de trafico={full}")
          if ready != "True" or not full:
              print("::error::Smoke test FALLA: la revision no quedo Ready o no recibe el 100% del trafico.")
              sys.exit(1)
          print("Smoke test PASA.")
          PYEOF
          python3 /tmp/smoke.py
