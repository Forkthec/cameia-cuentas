spring.jpa.show-sql=false

# Produccion nunca publica la documentacion: ni la interfaz Swagger UI ni el JSON
# OpenAPI. El valor es rigido a proposito, para que API_DOCUMENTATION_ENABLED no
# pueda exponer el contrato de la API desde una variable de entorno mal puesta.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Broker de eventos: en produccion no hay valores por defecto; BrokerSettingsGuard impide el arranque si falta alguno.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
