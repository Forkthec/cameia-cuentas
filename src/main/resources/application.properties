spring.application.name=cuentas
spring.profiles.default=local
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8081}

# Declara charset=UTF-8 en toda respuesta, tambien en application/problem+json (ASVS 4.1.1).
spring.servlet.encoding.force-response=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:DB-cuentas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Espera maxima por una conexion del pool. Con el valor por defecto (30 s), igual al tiempo del
# Gateway, una base caida hacia esperar 30 s y el cliente nunca veia el 503.
spring.datasource.hikari.connection-timeout=5000

spring.jpa.open-in-view=false

# Cuentas no recibe formularios. El filtro de Spring los lee antes de que exista un manejador
# de errores y un formulario mal codificado terminaba en un 500 sin formato.
spring.mvc.formcontent.filter.enabled=false

# Topes de multipart declarados para que no dependan del valor por defecto de Spring: 1 MiB por parte y
# 10 MiB por peticion. Ninguna ruta consume multipart; pasar un tope responde 413 REQUEST_BODY_TOO_LARGE.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=10MB

# El esquema lo crean las migraciones de Flyway, nunca Hibernate: el DDL de MicroCuentas
# usa restricciones y objetos que Hibernate no genera, y un esquema distinto en cada
# entorno vuelve inutiles las pruebas. Hibernate solo comprueba que las entidades
# coincidan con las tablas, y el arranque falla si no lo hacen (CM-14, CU-7).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=microcuentas

# Hibernate registra por su cuenta el mensaje de PostgreSQL al violarse una restriccion, y ese
# mensaje trae la fila con sus valores (nombre, telefono, fecha de nacimiento). El manejador de
# errores ya registra el nombre de la restriccion y la excepcion llega completa a quien la atiende.
logging.level.org.hibernate.orm.jdbc.error=OFF

# Cuando la conexion se corta, Spring registra aparte "Application exception overridden by rollback
# exception" con el SQL y el mensaje de PostgreSQL, ademas de la linea del manejador de errores, que ya
# deja el codigo, el requestId y la traza completa. Una sola linea de ERROR por peticion.
logging.level.org.springframework.transaction.interceptor.TransactionInterceptor=OFF

spring.flyway.schemas=microcuentas
spring.flyway.default-schema=microcuentas
spring.flyway.create-schemas=true

# Firebase Admin SDK: custodia las credenciales de los usuarios. En Cloud Run las
# credenciales salen del entorno y FIREBASE_KEY_PATH se deja vacio; en desarrollo apunta
# al JSON de la cuenta de servicio, que nunca se versiona. La aplicacion no arranca si el
# SDK esta habilitado y no puede leerlas.
cuentas.firebase.enabled=${FIREBASE_ENABLED:true}
cuentas.firebase.project-id=${FIREBASE_PROJECT_ID:}
cuentas.firebase.key-path=${FIREBASE_KEY_PATH:}

# Documentacion de la API: Swagger UI como interfaz de referencia sobre el OpenAPI de springdoc.
# API_DOCUMENTATION_ENABLED es el interruptor unico: apagado por defecto para que ningun
# entorno publique el contrato por descuido. El perfil local lo enciende y el perfil prod
# lo fija en false de forma rigida.
springdoc.api-docs.enabled=${API_DOCUMENTATION_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${API_DOCUMENTATION_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.display-request-duration=true

# Eventos de dominio en RabbitMQ. Host, puerto, usuario, contrasena, vhost y TLS llegan por SPRING_RABBITMQ_*.
# La publicacion espera la confirmacion del broker y considera fallido un mensaje sin cola de destino.
# Marcadores explicitos: desde el archivo .env las variables SPRING_RABBITMQ_* no se enlazan solas.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# El registro no debe sumar mas de 1 s por la publicacion (p95 <= 2 s): si el broker tarda, el evento queda pendiente para la tarea.
spring.rabbitmq.connection-timeout=500ms
# Un broker congelado no contesta al abrir un canal: sin este plazo la peticion esperaria 10 minutos.
spring.rabbitmq.channel-rpc-timeout=500ms
cuentas.events.enabled=${EVENTS_ENABLED:true}
cuentas.events.publish-timeout=${EVENTS_PUBLISH_TIMEOUT:500ms}

# Purga de cuentas sin verificar: tope de cuentas por ejecucion (de 1 a 1000)
cuentas.purge.max-accounts-per-run=${PURGE_MAX_ACCOUNTS_PER_RUN:1000}
